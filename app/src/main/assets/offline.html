<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>暂时无法连接</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,420px);text-align:center}.mark{width:84px;height:84px;margin:0 auto 24px;border-radius:24px;background:#fff8f2;display:grid;place-items:center;box-shadow:0 12px 36px rgba(0,0,0,.08)}
    .mark:before{content:"";width:34px;height:46px;border-radius:9px 9px 13px 13px;background:#1d1d1f;box-shadow:inset 0 -15px #ff6a00}
    h1{font-size:25px;margin:0 0 12px}p{font-size:16px;line-height:1.6;color:#6e6e73;margin:0 0 28px}button{border:0;border-radius:14px;background:#1d1d1f;color:#fff;font-size:16px;font-weight:650;padding:14px 24px;min-width:150px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>暂时无法连接</h1>
    <p>请检查网络后重试，你的云端数据不会丢失。</p>
    <button type="button" onclick="location.href='https://subscription.netkaize.com/'">重新连接</button>
  </main>
</body>
</html>
